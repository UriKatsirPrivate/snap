<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>snap</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #050914;
    --panel: rgba(255,255,255,0.035);
    --border: rgba(255,255,255,0.08);
    --text: rgba(233,240,255,0.92);
    --muted: rgba(233,240,255,0.4);
    --accent: #7df9c2;
    --accent-text: #04140d;
    --ok: #7df9c2;
    --ok-bg: rgba(125,249,194,0.14);
    --warn: #ff8a7a;
    --warn-bg: rgba(255,138,122,0.16);
    --off: rgba(233,240,255,0.38);
    --off-bg: rgba(233,240,255,0.08);
    --pinned: #9db4ff;
    --pinned-bg: rgba(157,180,255,0.16);
    --err: #ff5a5a;
    --err-bg: rgba(255,90,90,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top right, rgba(125,249,194,0.10), transparent 55%),
      radial-gradient(ellipse at bottom left, rgba(255,138,122,0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 300;
  }
  header {
    padding: 24px 28px 18px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 200; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  main {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    padding: 0 28px 20px;
    align-items: start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    backdrop-filter: blur(10px);
  }
  .panel h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 12.5px;
  }
  .tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
  label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  input, textarea {
    width: 100%;
    padding: 7px 9px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }
  textarea { resize: vertical; min-height: 54px; }
  button.run {
    margin-top: 14px;
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
    cursor: pointer;
  }
  button.run:disabled { background: var(--off); color: var(--bg); cursor: default; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge.selected, .badge.accepted { background: var(--ok-bg); color: var(--ok); }
  .badge.fallback { background: var(--warn-bg); color: var(--warn); }
  .badge.abstained { background: var(--off-bg); color: var(--off); }
  .badge.pinned { background: var(--pinned-bg); color: var(--pinned); }
  .badge.rejected { background: var(--err-bg); color: var(--err); }
  .badge.latency { background: rgba(255,255,255,0.09); color: var(--text); font-family: ui-monospace, monospace; text-transform: none; }

  #resultPanel .empty { color: var(--muted); }
  .option-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    font-family: ui-monospace, monospace;
    font-size: 12.5px;
  }
  .option-row.chosen { border-color: var(--ok); background: var(--ok-bg); }
  .option-row .mark { color: var(--ok); font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  td.mono { font-family: ui-monospace, monospace; }
  .stream-wrap { max-height: 480px; overflow: auto; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--err); font-size: 12.5px; margin-top: 8px; }
  .help {
    display: inline-block;
    width: 13px; height: 13px;
    line-height: 13px;
    border-radius: 50%;
    background: var(--border);
    color: var(--muted);
    font-size: 10px;
    text-align: center;
    margin-left: 4px;
    cursor: help;
    font-weight: 600;
  }
</style>
</head>
<body>
  <header>
    <h1>snap</h1>
    <span class="sub">host prepares options · Gemini picks one or abstains</span>
  </header>

  <main>
    <div class="panel">
      <div class="tabs">
        <div class="tab active" data-tab="route">Route</div>
        <div class="tab" data-tab="focus">Focus</div>
      </div>

      <form id="routeForm">
        <label>Task ID</label>
        <input name="task_id" value="t-1" />
        <label>Candidates (one per line: id,provider,model)</label>
        <textarea name="candidates">gemini-flash,google,gemini-2.5-flash
gemini-pro,google,gemini-2.5-pro
gemini-flash-lite,google,gemini-2.5-flash-light</textarea>
        <label>Fallback route id (optional)</label>
        <input name="fallback_route_id" value="gemini-flash-lite" />
        <label>Context (free text, sent as {"task": ...})</label>
        <textarea name="context">Refactor the authentication module across 12 files to use dependency injection</textarea>
        <button class="run" type="submit">Run route decision</button>
      </form>

      <form id="focusForm" style="display:none">
        <label>Task ID</label>
        <input name="task_id" value="t-1" />
        <label>Session ID</label>
        <input name="session_id" value="s-1" />
        <label>Available tools (comma separated)</label>
        <input name="available_tools" value="read_file,write_file,run_tests,grep" />
        <label>Context (free text)</label>
        <textarea name="context">Refactor the authentication module across 12 files to use dependency injection. Just started, nothing inspected yet.</textarea>
        <button class="run" type="submit">Run focus decision</button>
      </form>
      <div id="formError" class="error"></div>
    </div>

    <div class="panel" id="resultPanel">
      <h2>Result</h2>
      <div class="empty">Run a decision to see the result here.</div>
    </div>
  </main>

  <main style="grid-template-columns: 1fr; padding-top: 0;">
    <div class="panel">
      <div id="latencyStats" style="font-size:18px; font-weight:600; margin-bottom:14px; display:flex; align-items:baseline; gap:22px; flex-wrap:wrap; row-gap:6px;">No latency data yet.</div>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <h2>Decision stream</h2>
        <div id="clearHistoryArea" style="display:flex; align-items:center; gap:10px;">
          <span id="clearHistoryConfirm" style="display:none; font-size:12.5px; color:var(--muted);">
            Clear all decision history?
            <button id="clearHistoryYes" class="run" style="width:auto; margin-top:0; padding:4px 10px; background:#dc2626; color:#fff;">Yes, clear</button>
            <button id="clearHistoryNo" class="run" style="width:auto; margin-top:0; padding:4px 10px; background:rgba(255,255,255,0.08); color:var(--text);">Cancel</button>
          </span>
          <button id="clearHistoryBtn" class="run" style="width:auto; margin-top:0; padding:6px 12px; background:#dc2626; color:#fff;">Clear history</button>
        </div>
      </div>
      <div class="stream-wrap">
        <table>
          <thead>
            <tr>
              <th>Time<span class="help" title="When this decision record was created.">?</span></th>
              <th>Kind<span class="help" title="'route' = model/provider pick, 'focus' = inspect/implement/verify/answer pick.">?</span></th>
              <th>Task<span class="help" title="task_id from the request, to correlate decisions for the same task.">?</span></th>
              <th>Offered<span class="help" title="Number of candidates/options the host presented to the selector.">?</span></th>
              <th>Choice<span class="help" title="What Gemini itself picked, before validation. '—' if it abstained.">?</span></th>
              <th>Status<span class="help" title="accepted = Gemini's pick was used as-is. fallback = pick was invalid/abstained, fallback used instead. abstained = invalid pick and no fallback available.">?</span></th>
              <th>Final<span class="help" title="What the host actually used after validating Gemini's choice.">?</span></th>
              <th>Selector time<span class="help" title="Wall-clock time the Gemini selector call took, in ms.">?</span></th>
              <th>Selector cost<span class="help" title="Estimated USD cost of this selector call, based on Gemini token usage and the configured selector model's list price.">?</span></th>
            </tr>
          </thead>
          <tbody id="streamBody">
            <tr><td colspan="9" class="empty">No decisions recorded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

<script>
const tabs = document.querySelectorAll(".tab");
const routeForm = document.getElementById("routeForm");
const focusForm = document.getElementById("focusForm");
tabs.forEach(t => t.addEventListener("click", () => {
  tabs.forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  const isRoute = t.dataset.tab === "route";
  routeForm.style.display = isRoute ? "" : "none";
  focusForm.style.display = isRoute ? "none" : "";
}));

const resultPanel = document.getElementById("resultPanel");
const formError = document.getElementById("formError");

function statusBadge(decision) {
  return `<span class="badge ${decision}">${decision}</span>`;
}

function latencyBadge(ms) {
  if (ms === null || ms === undefined) return "";
  return `<span class="badge latency">${ms.toFixed(0)} ms</span>`;
}

function costBadge(usd) {
  if (usd === null || usd === undefined) return "";
  return `<span class="badge latency">$${usd.toFixed(6)}</span>`;
}

function renderRouteResult(req, resp) {
  const rows = req.candidates.map(c => {
    const isChosen = resp.chosen && resp.chosen.id === c.id;
    return `<div class="option-row ${isChosen ? "chosen" : ""}">
      <span>${c.id} <span style="color:var(--muted)">(${c.provider}/${c.model})</span></span>
      ${isChosen ? '<span class="mark">chosen</span>' : ""}
    </div>`;
  }).join("");
  resultPanel.innerHTML = `
    <h2>Result ${statusBadge(resp.decision)} ${latencyBadge(resp.selector_latency_ms)} ${costBadge(resp.selector_cost_usd)}</h2>
    ${rows}
    <div class="hint" style="margin-top:10px;">record_id: ${resp.record_id}</div>
  `;
}

function renderFocusResult(req, resp) {
  const focusIds = ["inspect", "implement", "verify", "answer"];
  const rows = focusIds.map(f => {
    const isChosen = resp.focus === f;
    return `<div class="option-row ${isChosen ? "chosen" : ""}">
      <span>${f}</span>
      ${isChosen ? '<span class="mark">chosen</span>' : ""}
    </div>`;
  }).join("");
  resultPanel.innerHTML = `
    <h2>Result ${statusBadge(resp.decision)} ${latencyBadge(resp.selector_latency_ms)} ${costBadge(resp.selector_cost_usd)}</h2>
    ${rows}
    <div class="hint" style="margin-top:10px;">tools: ${resp.tools.join(", ") || "(none)"}</div>
    <div class="hint">record_id: ${resp.record_id}</div>
  `;
}

routeForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  formError.textContent = "";
  const fd = new FormData(routeForm);
  const candidates = fd.get("candidates").split("\n").filter(Boolean).map(line => {
    const [id, provider, model] = line.split(",").map(s => s.trim());
    return { id, provider, model };
  });
  const body = {
    task_id: fd.get("task_id"),
    candidates,
    fallback_route_id: fd.get("fallback_route_id") || null,
    context: { task: fd.get("context") },
  };
  resultPanel.innerHTML = `<h2>Result <span class="spinner"></span></h2>`;
  try {
    const res = await fetch("/v1/decisions/route", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    renderRouteResult(body, await res.json());
    loadStream();
  } catch (err) {
    formError.textContent = err.message;
    resultPanel.innerHTML = `<h2>Result</h2><div class="empty">Failed.</div>`;
  }
});

focusForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  formError.textContent = "";
  const fd = new FormData(focusForm);
  const tools = fd.get("available_tools").split(",").map(s => s.trim()).filter(Boolean).map(name => ({ name }));
  const body = {
    task_id: fd.get("task_id"),
    session_id: fd.get("session_id"),
    available_tools: tools,
    context: { task: fd.get("context") },
  };
  resultPanel.innerHTML = `<h2>Result <span class="spinner"></span></h2>`;
  try {
    const res = await fetch("/v1/decisions/focus", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    renderFocusResult(body, await res.json());
    loadStream();
  } catch (err) {
    formError.textContent = err.message;
    resultPanel.innerHTML = `<h2>Result</h2><div class="empty">Failed.</div>`;
  }
});

function statusFor(r) {
  if (r.kind === "route" && r.validated === false && !r.fallback_used) return "abstained";
  if (r.fallback_used) return "fallback";
  if (r.abstained) return "abstained";
  return "accepted";
}

function median(sorted) {
  if (!sorted.length) return null;
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function renderLatencyStats(records) {
  const el = document.getElementById("latencyStats");
  const latencies = records.map(r => r.selector_latency_ms).filter(v => v != null).sort((a, b) => a - b);
  if (!latencies.length) {
    el.textContent = "No latency data yet.";
    return;
  }
  const avg = latencies.reduce((a, b) => a + b, 0) / latencies.length;
  const costs = records.map(r => r.selector_cost_usd).filter(v => v != null);
  const totalCost = costs.reduce((a, b) => a + b, 0);
  const costPart = costs.length
    ? `<span>$${totalCost.toFixed(6)} selector cost <span style="color:var(--muted); font-weight:400; font-size:13px;">(last ${costs.length} shown)</span></span>`
    : "";
  el.innerHTML = `
    <span>avg ${avg.toFixed(0)} ms &nbsp;&middot;&nbsp; median ${median(latencies).toFixed(0)} ms <span style="color:var(--muted); font-weight:400; font-size:13px;">(n=${latencies.length})</span></span>
    ${costPart}
  `;
}

async function loadStream() {
  const streamBody = document.getElementById("streamBody");
  try {
    const res = await fetch("/v1/decisions/recent?limit=25");
    const records = await res.json();
    renderLatencyStats(records);
    if (!records.length) {
      streamBody.innerHTML = `<tr><td colspan="9" class="empty">No decisions recorded yet.</td></tr>`;
      return;
    }
    streamBody.innerHTML = records.map(r => `
      <tr>
        <td class="mono">${new Date(r.created_at).toLocaleTimeString()}</td>
        <td>${r.kind}</td>
        <td class="mono">${r.task_id}</td>
        <td class="mono">${r.offered.length}</td>
        <td class="mono">${r.selector_choice ?? "—"}</td>
        <td>${statusBadge(statusFor(r))}</td>
        <td class="mono">${r.final_choice ?? "—"}</td>
        <td class="mono">${r.selector_latency_ms != null ? r.selector_latency_ms.toFixed(0) + " ms" : "—"}</td>
        <td class="mono">${r.selector_cost_usd != null ? "$" + r.selector_cost_usd.toFixed(6) : "—"}</td>
      </tr>
    `).join("");
  } catch (err) {
    streamBody.innerHTML = `<tr><td colspan="9" class="empty">Failed to load: ${err.message}</td></tr>`;
  }
}

const clearBtn = document.getElementById("clearHistoryBtn");
const clearConfirm = document.getElementById("clearHistoryConfirm");

clearBtn.addEventListener("click", () => {
  clearBtn.style.display = "none";
  clearConfirm.style.display = "inline-flex";
  clearConfirm.style.alignItems = "center";
  clearConfirm.style.gap = "8px";
});

document.getElementById("clearHistoryNo").addEventListener("click", () => {
  clearConfirm.style.display = "none";
  clearBtn.style.display = "";
});

document.getElementById("clearHistoryYes").addEventListener("click", async () => {
  clearConfirm.style.display = "none";
  clearBtn.style.display = "";
  try {
    await fetch("/v1/decisions", { method: "DELETE" });
    loadStream();
  } catch (err) {
    formError.textContent = "Failed to clear history: " + err.message;
  }
});

loadStream();
setInterval(loadStream, 4000);
</script>
</body>
</html>
